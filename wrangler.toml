/**
 * Cloudflare Worker to proxy API requests to Flask backend
 * Deploy this in Cloudflare Workers and add route: findjernal.pages.dev/api/*
 */

const BACKEND_URL = 'http://YOUR_BACKEND_URL'; // Replace with your Flask server URL

export default {
  async fetch(request) {
    const url = new URL(request.url);
    
    // Handle API requests
    if (url.pathname.startsWith('/api/')) {
      const backendUrl = BACKEND_URL + url.pathname + url.search;
      
      const backendRequest = new Request(backendUrl, {
        method: request.method,
        headers: {
          'Content-Type': 'application/json',
          'Origin': request.headers.get('Origin') || '*',
          ...request.headers,
        },
        body: request.method !== 'GET' ? request.body : undefined,
      });
      
      try {
        const response = await fetch(backendRequest);
        const newResponse = new Response(response.body, response);
        
        // Add CORS headers
        newResponse.headers.set('Access-Control-Allow-Origin', '*');
        newResponse.headers.set('Access-Control-Allow-Methods', 'GET, POST, OPTIONS, DELETE, PUT');
        newResponse.headers.set('Access-Control-Allow-Headers', 'Content-Type');
        
        return newResponse;
      } catch (error) {
        return new Response(JSON.stringify({ error: error.message }), {
          status: 500,
          headers: { 'Content-Type': 'application/json' },
        });
      }
    }
    
    // Let other requests pass through to Pages
    return fetch(request);
  },
};
