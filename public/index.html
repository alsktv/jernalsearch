<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF 업로드로 참고문헌 추출</title>
  <style>
    body{font-family:Inter, Arial, sans-serif;background:#f3f6fb;margin:0;color:#0f172a}
    .wrap{max-width:920px;margin:28px auto;padding:20px}
    .dropzone{border:3px dashed #4A90E2;border-radius:12px;padding:40px;background:linear-gradient(180deg,#ffffff, #f7fbff);text-align:center;cursor:pointer}
    .dropzone.dragover{box-shadow:0 8px 30px rgba(74,144,226,0.12);transform:translateY(-2px)}
    .dropzone .icon{font-size:48px;margin-bottom:8px;color:#4A90E2}
    .dropzone p{margin:6px 0;color:#0f172a;font-weight:700}
    .hint{color:#6b7280;font-size:14px}
    .status{margin-top:18px;font-weight:600}
    .step{margin-top:10px;color:#374151}
    .results{margin-top:22px}
    .card{background:#fff;border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(15,23,42,0.04);margin-bottom:12px}
    .meta{max-width:75%}
    .title{font-weight:700;color:#0f172a}
    .sub{color:#475569;margin-top:6px}
    .btn{background:#1e40af;color:#fff;padding:10px 12px;border-radius:8px;text-decoration:none}
    .btn.disabled{background:#cbd5e1;color:#fff;pointer-events:none;opacity:0.8}
    .no-results{color:#6b7280;padding:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <h2>PDF 업로드로 참고문헌 추출 및 Open Access PDF 탐색</h2>
    <div id="dropzone" class="dropzone" role="button" tabindex="0">
      <div class="icon">📄</div>
      <p>논문 PDF 파일을 마우스로 여기에 끌어놓으세요</p>
      <div class="hint">(PDF 뒤쪽의 References 섹션을 분석하여 전문(텍스트)과 참고문헌 메타데이터를 추출하여 화면에 보여줍니다)</div>
      <input id="fileinput" type="file" accept="application/pdf" style="display:none">
    </div>

    <div id="status" style="display:none">
      <div class="status">진행 상황: <span id="status-text"></span></div>
      <div id="error-area" style="display:none;color:#b91c1c;margin-top:8px"></div>
      <div class="step" id="step-upload">PDF 구조 파싱 중...</div>
      <div class="step" id="step-analyze">Gemini 참고문헌 분석 중...</div>
      <div class="step" id="step-match">참고문헌 정리 중...</div>
    </div>

    <div class="results" id="results"></div>
  </div>

<script>
const dropzone = document.getElementById('dropzone');
const fileinput = document.getElementById('fileinput');
const status = document.getElementById('status');
const statusText = document.getElementById('status-text');
const stepUpload = document.getElementById('step-upload');
const stepAnalyze = document.getElementById('step-analyze');
const stepMatch = document.getElementById('step-match');
const resultsEl = document.getElementById('results');

function setPhase(phase){
  stepUpload.style.opacity = phase>=1? '1':'0.4';
  stepAnalyze.style.opacity = phase>=2? '1':'0.4';
  stepMatch.style.opacity = phase>=3? '1':'0.4';
}

['dragenter','dragover'].forEach(e=>dropzone.addEventListener(e, ev=>{ev.preventDefault(); dropzone.classList.add('dragover');}));
['dragleave','drop'].forEach(e=>dropzone.addEventListener(e, ev=>{ev.preventDefault(); dropzone.classList.remove('dragover');}));

dropzone.addEventListener('click', ()=> fileinput.click());
fileinput.addEventListener('change', e=> handleFiles(e.target.files));

dropzone.addEventListener('drop', ev=>{ ev.preventDefault(); const dt = ev.dataTransfer; if(dt && dt.files && dt.files.length) handleFiles(dt.files); });

function handleFiles(files){
  if(!files || files.length===0) return;
  const f = files[0];
  if(f.type !== 'application/pdf') { alert('PDF 파일만 업로드해 주세요.'); return; }
  uploadFile(f);
}

async function uploadFile(file){
  resultsEl.innerHTML = '';
  status.style.display = 'block';
  statusText.textContent = '파일 업로드 시작';
  setPhase(1);

  const fd = new FormData(); fd.append('file', file);
  try{
    statusText.textContent = 'PDF 구조 파싱 중...';
    setPhase(1);
    const resp = await fetch('/api/upload-pdf', { method: 'POST', body: fd });

    statusText.textContent = 'Gemini 참고문헌 분석 중...';
    setPhase(2);

    async function extractErrorMessage(response){
      try{ const j = await response.json(); if(j && j.error) return j.error; }catch(e){}
      try{ const t = await response.text(); if(t) return t; }catch(e){}
      return `HTTP ${response.status} ${response.statusText}`;
    }

    if(!resp.ok){
      const errMsg = await extractErrorMessage(resp);
      statusText.textContent = '오류 발생';
      const errorArea = document.getElementById('error-area');
      if(errorArea){ errorArea.style.display='block'; errorArea.textContent = errMsg; }
      resultsEl.innerHTML = `<div class="no-results">${errMsg}</div>`;
      return;
    }

    statusText.textContent = '다운로드 링크 매칭 중...';
    setPhase(3);

    const data = await resp.json();
    status.style.display = 'none';
    renderResults(data);
  }catch(err){
    statusText.textContent = '네트워크 오류';
    const errorArea = document.getElementById('error-area');
    const msg = err && err.message ? err.message : String(err);
    if(errorArea){ errorArea.style.display='block'; errorArea.textContent = msg; }
    resultsEl.innerHTML = `<div class="no-results">업로드 실패: ${msg}</div>`;
  }
}

function renderResults(data){
  if(!data){
    resultsEl.innerHTML = '<div class="no-results">서버 응답이 비어 있습니다.</div>';
    return;
  }
  resultsEl.innerHTML = '';

  const textCard = document.createElement('div'); textCard.className='card';
  const pre = document.createElement('pre'); pre.style.whiteSpace='pre-wrap'; pre.style.margin='0'; pre.style.fontFamily='inherit'; pre.style.fontSize='14px';
  pre.textContent = data.extracted_text || '(추출된 텍스트 없음)';
  textCard.appendChild(pre);
  resultsEl.appendChild(textCard);

  const header = document.createElement('h3'); header.textContent = '추출된 참고문헌'; header.style.marginTop='18px'; resultsEl.appendChild(header);
  const refs = data.references || [];
  if(refs.length === 0){
    resultsEl.appendChild(document.createElement('div')).innerHTML = '<div class="no-results">참고문헌을 찾지 못했습니다.</div>';
    return;
  }
  refs.forEach(it=>{
    const card = document.createElement('div'); card.className='card';
    const meta = document.createElement('div'); meta.className='meta';
    const title = document.createElement('div'); title.className='title'; title.textContent = it.title || '제목 없음';
    const sub = document.createElement('div'); sub.className='sub'; sub.textContent = (it.authors? it.authors + ' · ' : '') + (it.year? it.year : '연도 정보 없음');
    meta.appendChild(title); meta.appendChild(sub);
    card.appendChild(meta);
    resultsEl.appendChild(card);
  });
}
</script>
</body>
</html>
